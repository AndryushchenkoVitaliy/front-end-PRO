<!DOCTYPE html>
<html lang="ua">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>hw21t1</title>
</head>

<body>
  <div class="todo">
    <h2 class="todo__title">📝 To-Do List</h2>

    <ul class="todo__list" id="list">
      <li>
        Завдання 1
        <button class="delete">Видалити</button>
      </li>
      <li>
        Завдання 2
        <button class="delete">Видалити</button>
      </li>
      <li>
        Завдання 3
        <button class="delete">Видалити</button>
      </li>
      <li>
        Завдання 4
        <button class="delete">Видалити</button>
      </li>
    </ul>

    <div class="todo__controls">
      <input type="text" id="taskInput" placeholder="Додати нове завдання">
      <button class="add" id="addBtn">Додати</button>
    </div>
  </div>

  <!-- Bootstrap modal -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Текст завдання</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalTaskText"></div>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./dist/main.js"></script>
</body>

</html>
