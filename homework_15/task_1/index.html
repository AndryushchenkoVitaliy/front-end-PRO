<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <script src="./js/main.js" defer></script>
  <title>hw15t1</title>
</head>

<body>

  <div class="container">
    <h1>ToDoList</h1>
    <form class="form js--form">
      <input type="text" name="value" required class="form__input js--form__input">
      <button class="form__btn">Додати</button>
    </form>

    <h2>
      Всього: <span class="js--total">0</span> |
      Виконано: <span class="js--completed">0</span>
    </h2>
    <div class="progress">
      <div class="progress__bar js--progress-bar">
        <span class="progress__text js--progress-text">0%</span>
      </div>
    </div>
    <ul class="js--todos-wrapper">
      <li class="todo-item">
        <input type="checkbox">
        <span class="todo-item__description">Text</span>
        <button class="todo-item__delete">Видалити</button>
      </li>
      <li class="todo-item todo-item--checked">
        <input type="checkbox">
        <span class="todo-item__description">Text</span>
        <button class="todo-item__delete">Видалити</button>
      </li>
    </ul>
  </div>

</body>

</html>
