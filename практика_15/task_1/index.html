<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <script src="./js/main.js" defer></script>
  <title>hw15t1</title>
</head>

<body>

  <table id="userTable">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Age</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button class="btn-add" onclick="showForm()">Add User</button>

  <div id="formBlock" class="form-container" style="display:none;">
    <input type="text" id="userName" placeholder="Name">
    <input type="text" id="userPhone" placeholder="Phone">
    <input type="number" id="userAge" placeholder="Age">
    <button id="saveBtn" style="background: #6200ee; color: white; width: 100%; height: 35px;">OK</button>
  </div>

  <div id="viewBlock" class="view-container" style="display:none;">
    <h4>User Details:</h4>
    <pre id="jsonOutput"></pre>
  </div>

</body>

</html>
